<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্রাহকদের তালিকা - Kahaf Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f8f9fa; }</style>
</head>
<body class="py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-users me-2"></i>সকল গ্রাহকদের তালিকা</h4>
            <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-outline-dark btn-sm"><i class="fa-solid fa-arrow-left me-1"></i>ড্যাশবোর্ড</a>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 12px; overflow: hidden;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>আইডি</th>
                            <th>গ্রাহকের নাম (প্রোফাইল দেখতে ক্লিক করুন)</th>
                            <th>মোবাইল নাম্বার</th>
                            <th>প্রোডাক্ট/সার্ভিস</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in customers %}
                        <tr>
                            <td><span class="badge bg-secondary">{{ c.registration_id }}</span></td>
                            <td>
                                <!-- 🌟 নামের উপর ক্লিক করলে প্রোফাইলে যাবে -->
                                <a href="{% url 'admin_customer_profile' c.id %}" class="text-primary fw-bold text-decoration-none">
                                    {{ c.name }} <i class="fa-solid fa-arrow-up-right-from-square ms-1 small"></i>
                                </a>
                            </td>
                            <td><a href="tel:{{ c.mobile_number }}" class="text-dark text-decoration-none"><i class="fa-solid fa-phone text-success me-1"></i>{{ c.mobile_number }}</a></td>
                            <td><small class="text-muted">{{ c.product.name|default:"-- নেই --" }}</small></td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="4" class="text-center py-4 text-muted">কোনো গ্রাহক পাওয়া যায়নি।</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
