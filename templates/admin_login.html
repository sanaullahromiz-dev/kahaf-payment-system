<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahaf Computer - এডমিন লগইন</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .admin-login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .admin-header h3 {
            color: #1e293b;
            font-weight: 700;
        }
        .admin-header p {
            color: #64748b;
            font-size: 0.9rem;
        }
        .btn-admin {
            background-color: #0f172a;
            color: #ffffff;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-admin:hover {
            background-color: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="admin-login-card">
    <div class="admin-header">
        <h3> Kahaf Computer</h3>
        <p class="text-danger fw-bold">🔐 এডমিন প্যানেল লগইন</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label font-weight-bold">এডমিন ইউজারনেম</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="আপনার এডমিন ইউজারনেম লিখুন" required>
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label font-weight-bold">পাসওয়ার্ড</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="পাসওয়ার্ড লিখুন" required>
        </div>

        <button type="submit" class="btn btn-admin">এডমিন প্যানেলে প্রবেশ করুন 🚀</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
