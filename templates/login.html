<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Zarif Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f3; }
        .login-card { max-width: 420px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card login-card p-4 w-100">
        <h3 class="text-center fw-bold text-primary mb-3">Zarif Pay</h3>
        <p class="text-center text-muted small mb-4">আপনার অ্যাকাউন্টে প্রবেশ করতে মোবাইল ও পাসওয়ার্ড দিন</p>
        
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-danger p-2 text-center small">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">মোবাইল নাম্বার</label>
                <input type="text" name="mobile_number" class="form-control" placeholder="017xxxxxxxx" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">পাসওয়ার্ড</label>
                <input type="password" name="password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">লগইন করুন</button>
        </form>

        <div class="text-center mt-3 border-top pt-3">
            <p class="mb-1 small">নতুন গ্রাহক হলে? <a href="{% url 'register' %}" class="fw-bold text-decoration-none">একাউন্ট তৈরি করুন</a></p>
            <small class="text-muted">একাউন্ট তৈরিতে সমস্যা হলে এডমিনের সাথে যোগাযোগ করুন।</small>
        </div>
    </div>
</body>
</html>
