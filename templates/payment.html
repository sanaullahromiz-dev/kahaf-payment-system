<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেমেন্ট করুন - Kahaf Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f4f6f9; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card p-4 w-100 shadow" style="max-width: 550px; border-radius: 15px; border: none;">
        <h4 class="fw-bold text-center text-primary mb-4">পেমেন্ট নিশ্চিতকরণ ফর্ম</h4>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold text-danger">সেলার রশিদ নং (এখানে রশিদ নং দিন)</label>
                <input type="text" id="receipt_no" name="receipt_no" class="form-control border-danger" placeholder="যেমন: 1001" required>
                <small class="text-muted">রশিদ নং দিলে নিচের তথ্যগুলো অটোমেটিক পূরণ হয়ে যাবে।</small>
            </div>

            <div class="row g-2 mb-3 bg-light p-3 rounded">
                <div class="col-6">
                    <small class="text-muted d-block">গ্রাহকের নাম</small>
                    <strong class="text-dark" id="disp_name">{{ profile.name }}</strong>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">আইডি নাম্বার</small>
                    <strong class="text-dark" id="disp_id">{{ profile.registration_id }}</strong>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">প্রোডাক্ট/সার্ভিসের নাম</label>
                <input type="text" id="product_name" name="product_name" class="form-control" readonly required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold">মোট মূল্য (৳)</label>
                    <input type="number" id="total_amount" step="0.01" name="total_amount" class="form-control" readonly required>
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold">পরিশোধের ধরন</label>
                    <input type="text" id="payment_type" name="payment_type" class="form-control" readonly required>
                </div>
            </div>

            <div class="mb-3 border-top pt-3">
                <label class="form-label fw-bold">পেমেন্ট টাইপ নির্বাচন করুন</label>
                <select name="payment_method" class="form-select" required>
                    <option value="bKash">বিকাশ (bKash)</option>
                    <option value="Nagad">নগদ (Nagad)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">ট্রানজেকশন আইডি নাম্বার (TrxID)</label>
                <input type="text" name="transaction_id" class="form-control" placeholder="যেমন: 8JHD783N" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">পরিশোধিত টাকা (আপনি কত টাকা পাঠিয়েছেন)</label>
                <input type="number" step="0.01" name="paid_amount" class="form-control border-success" placeholder="00.00" required>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold py-2 fs-5">✅ পেমেন্ট নিশ্চিত করুন</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">ফিরে যান</a>
        </form>
    </div>

    <script>
        // অটোমেটিক ডাটা আনার জাভাস্ক্রিপ্ট
        document.getElementById('receipt_no').addEventListener('input', function() {
            let receiptNo = this.value;
            if(receiptNo.length > 0) {
                // এখানে API লিংকের আগে admin-panel যুক্ত করা হয়েছে
                fetch(`/admin-panel/api/receipt/${receiptNo}/`)
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        document.getElementById('disp_name').innerText = data.customer_name;
                        document.getElementById('disp_id').innerText = data.customer_id;
                        document.getElementById('product_name').value = data.product_name;
                        document.getElementById('total_amount').value = data.total_amount;
                        
                        // পেমেন্টের ধরন ইংরেজিতে আসলে তা বাংলায় দেখানোর জন্য (ঐচ্ছিক)
                        let paymentTypeBangla = data.payment_type;
                        if(data.payment_type === 'One-time') paymentTypeBangla = 'এককালীন';
                        else if(data.payment_type === 'Monthly') paymentTypeBangla = 'মাসিক';
                        else if(data.payment_type === 'Yearly') paymentTypeBangla = 'বাৎসরিক';
                        
                        document.getElementById('payment_type').value = paymentTypeBangla;
                    } else {
                        // রশিদ নম্বর ভুল হলে ফিল্ডগুলো ফাঁকা করে দেবে
                        document.getElementById('product_name').value = '';
                        document.getElementById('total_amount').value = '';
                        document.getElementById('payment_type').value = '';
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
            }
        });
    </script>
</body>
</html>
