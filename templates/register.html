<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>একাউন্ট তৈরি করুন - Zarif Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f3; }
        .reg-card { max-width: 450px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card reg-card p-4 w-100 my-4">
        <h4 class="text-center fw-bold text-success mb-3">নতুন একাউন্ট তৈরি করুন</h4>
        
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-warning p-2 text-center small">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">নিবন্ধন ফরম আইডি</label>
                <input type="text" name="registration_id" class="form-control" placeholder="যেমন: REG-101" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">মোবাইল নাম্বার</label>
                <input type="text" name="mobile_number" class="form-control" placeholder="017xxxxxxxx" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">পাসওয়ার্ড</label>
                <input type="password" name="password" class="form-control" placeholder="******" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">পাসওয়ার্ড পুনরায় দিন</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">একাউন্ট তৈরি করুন</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small text-decoration-none">পূর্বেই একাউন্ট রয়েছে? লগইন করুন</a>
        </div>
    </div>
</body>
</html>
